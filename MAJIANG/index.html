<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出风</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; }
        .mahjong-table {
            background: radial-gradient(circle, #2b6c3b 0%, #153e20 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }
        /* 拟真麻将牌样式 */
        .mahjong-tile {
            width: 46px; 
            height: 64px;
            background: linear-gradient(to bottom, #ffffff 75%, #e0e0e0 100%);
            border-radius: 6px;
            border-bottom: 6px solid #4ade80; /* 绿色牌背 */
            border-right: 1px solid #ccc;
            border-left: 1px solid #fff;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: bold; 
            font-size: 1.4rem; 
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .mahjong-tile:hover {
            transform: translateY(-10px);
        }
        .mahjong-tile.wind { color: #2563eb; } /* 风牌蓝色 */
        .mahjong-tile.wan { color: #dc2626; } /* 万字红色 */
        .mahjong-tile.tong { color: #059669; } /* 筒子绿色 */
        
        .discard-tile {
            width: 34px; height: 48px; font-size: 1rem; border-bottom: 4px solid #4ade80;
        }
        .seat-btn.active {
            background-color: #f59e0b; color: white; border-color: #f59e0b;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden">
    <div id="app" class="h-full w-full">
        
        <!-- 页面一：大厅 (Home) -->
        <div v-if="view === 'home'" class="h-full flex flex-col items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-green-800">
            <h1 class="text-6xl font-bold text-white mb-12 drop-shadow-lg tracking-widest">出风</h1>
            
            <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 space-y-6">
                <!-- 新建房间 -->
                <div class="space-y-2">
                    <label class="block text-gray-700 font-bold">创建新房间</label>
                    <input v-model="createPwd" type="password" placeholder="设置房间密码 (可选)" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                    <button @click="createRoom" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">新建房间</button>
                </div>

                <div class="border-t border-gray-200 my-4"></div>

                <!-- 加入房间 -->
                <div class="space-y-2">
                    <label class="block text-gray-700 font-bold">加入房间</label>
                    <input v-model="joinPwd" type="password" placeholder="输入房间密码" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button @click="joinRoom" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">加入房间</button>
                </div>
            </div>
        </div>

        <!-- 页面二：房间等待页 (Room) -->
        <div v-if="view === 'room'" class="h-full flex flex-col items-center justify-center bg-gray-800">
            <div class="bg-white p-10 rounded-2xl shadow-2xl w-2/3 max-w-2xl text-center">
                <h2 class="text-3xl font-bold mb-2">房间号: {{ roomId }}</h2>
                <p class="text-gray-500 mb-8">请选择您的座位</p>
                
                <div class="grid grid-cols-2 gap-6 mb-10 w-3/4 mx-auto">
                    <button v-for="seat in ['东', '南', '西', '北']" :key="seat" 
                            @click="selectSeat(seat)"
                            :disabled="roomInfo.seats && roomInfo.seats[seat] && mySeat !== seat"
                            :class="['seat-btn py-4 border-2 rounded-xl text-xl font-bold transition', 
                                     mySeat === seat ? 'active' : 
                                     (roomInfo.seats && roomInfo.seats[seat] ? 'bg-gray-300 border-gray-400 text-gray-500 cursor-not-allowed' : 'border-gray-300 text-gray-600 hover:bg-gray-100')]">
                        {{ seat }}风位 {{ roomInfo.seats && roomInfo.seats[seat] ? (mySeat === seat ? '(你)' : '(已占)') : '' }}
                        <span v-if="roomInfo.seats && roomInfo.seats[seat] && roomInfo.seats[seat].ready" class="block text-sm text-green-600">已准备</span>
                    </button>
                </div>

                <div class="flex space-x-4 justify-center">
                    <button @click="view = 'home'" class="px-8 py-3 bg-gray-400 hover:bg-gray-500 text-white rounded-lg font-bold transition">返回大厅</button>
                    <button v-if="mySeat && (!roomInfo.seats[mySeat] || !roomInfo.seats[mySeat].ready)" @click="ready" class="px-12 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold text-xl shadow-lg transition">准备</button>
                    <button v-if="mySeat && roomInfo.seats[mySeat] && roomInfo.seats[mySeat].ready" class="px-12 py-3 bg-gray-400 text-white rounded-lg font-bold text-xl shadow-lg cursor-not-allowed">
                        等待其他人... 
                    </button>
                </div>
                
                <div v-if="waitingMsg" class="mt-6 text-yellow-600 font-bold text-lg animate-pulse">
                    {{ waitingMsg }}
                </div>
            </div>
        </div>

        <!-- 页面三：游戏桌 (Game) -->
        <div v-if="view === 'game'" class="h-full flex flex-col mahjong-table relative">
            <!-- 顶部信息 -->
            <div class="absolute top-4 left-4 text-white/80 font-bold">
                房间: {{ roomId }} | 你的位置: {{ mySeat }}风 | 状态: <span class="text-yellow-400">{{ isTing ? '已报听' : '行牌中' }}</span>
            </div>

            <div class="absolute top-4 right-4 text-white/80 font-bold">
                牌库剩余: {{ gameState.deckCount }} 张 | 当前出牌: <span class="text-yellow-400 text-xl">{{ gameState.currentTurn }}风</span>
            </div>

            <!-- 打出的牌堆 (模拟) -->
            <div class="flex-1 flex items-center justify-center p-10">
                <div class="bg-black/20 p-6 rounded-xl flex flex-wrap gap-2 content-start w-2/3 h-64 overflow-y-auto">
                    <div v-for="(tile, idx) in gameState.discardPile" :key="idx" 
                         :class="['mahjong-tile discard-tile', getTileClass(tile)]">
                        {{ tile }}
                    </div>
                    <div v-if="!gameState.discardPile || gameState.discardPile.length === 0" class="text-white/30 text-2xl m-auto">出牌区</div>
                </div>
            </div>

            <!-- 操作按钮区 -->
            <div class="flex justify-center space-x-6 mb-4 h-12">
                <div v-if="gameState.currentTurn !== mySeat" class="text-white text-xl font-bold flex items-center">等待 {{ gameState.currentTurn }}风 操作...</div>
                
                <template v-if="gameState.currentTurn === mySeat">
                    <button v-if="!isTing && hand.length < 14" @click="drawTile" class="px-8 py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg shadow border-2 border-blue-400 transition transform hover:scale-105 animate-bounce">摸牌</button>
                    
                    <button v-if="!isTing && hand.length === 14" @click="declareTing" 
                            :class="['px-6 py-2 font-bold rounded-lg shadow border-2 transition', pendingTing ? 'bg-yellow-500 border-yellow-400 text-white animate-pulse' : 'bg-red-600 hover:bg-red-700 text-white border-red-500']">
                        {{ pendingTing ? '请点击你要打出的风牌...' : '报听 (必须出风)' }}
                    </button>
                    <button v-if="pendingTing" @click="pendingTing = false" class="px-6 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg font-bold transition">取消报听</button>
                </template>
                
                <button @click="exitGame" class="absolute bottom-4 right-4 px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded shadow text-sm">退出房间</button>
            </div>

            <!-- 玩家手牌 -->
            <div class="h-32 bg-black/40 flex items-end justify-center pb-4 px-10 gap-1 rounded-t-2xl mx-20">
                <div v-for="(tile, index) in hand" :key="index" 
                     @click="discardTile(index)"
                     :class="['mahjong-tile', getTileClass(tile), pendingTing && !isWind(tile) ? 'opacity-50 cursor-not-allowed' : '']">
                    {{ tile }}
                </div>
            </div>
            
            <!-- 提示弹窗 -->
            <div v-if="msg" class="absolute top-1/3 left-1/2 transform -translate-x-1/2 bg-black/80 text-white px-8 py-4 rounded-xl text-xl font-bold shadow-2xl z-50 transition-opacity duration-300">
                {{ msg }}
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const socket = io('http://localhost:3000'); // 明确指定连接地址，支持直接打开 html 文件
                const view = ref('home');
                const createPwd = ref('');
                const joinPwd = ref('');
                const roomId = ref('');
                const mySeat = ref(null);
                
                // 游戏状态
                const roomInfo = ref({ seats: {} });
                const gameState = ref({ deckCount: 0, discardPile: [], currentTurn: '' });
                const hand = ref([]);
                const isTing = ref(false);
                const pendingTing = ref(false);
                const msg = ref('');
                const waitingMsg = ref('');

                const winds = ['东', '南', '西', '北'];

                const showMsg = (text) => {
                    msg.value = text;
                    setTimeout(() => msg.value = '', 2500);
                };

                onMounted(() => {
                    socket.on('roomUpdated', (info) => {
                        roomInfo.value = info;
                        roomId.value = info.id;
                        // 如果房间状态更新，清除等待消息（比如有人取消准备或退出）
                        waitingMsg.value = '';
                    });

                    socket.on('waitingForPlayers', (data) => {
                        waitingMsg.value = data.message;
                    });

                    socket.on('gameStarted', (data) => {
                        hand.value = data.hand;
                        isTing.value = data.isTing;
                        pendingTing.value = false;
                        view.value = 'game';
                    });

                    socket.on('gameStateUpdated', (state) => {
                        gameState.value = state;
                    });

                    socket.on('handUpdated', (data) => {
                        hand.value = data.hand;
                        if (data.isTing !== undefined) {
                            isTing.value = data.isTing;
                        }
                        sortHand();
                    });

                    socket.on('playerTing', (data) => {
                        showMsg(`${data.seat}风 玩家已报听！`);
                    });

                    socket.on('errorMsg', (err) => {
                        showMsg(err);
                    });

                    socket.on('gameOver', (data) => {
                        showMsg(data.message);
                        setTimeout(() => {
                            view.value = 'room';
                            mySeat.value = null;
                        }, 3000);
                    });
                });

                const createRoom = () => {
                    socket.emit('createRoom', { password: createPwd.value }, (res) => {
                        if (res.success) {
                            roomId.value = res.roomId;
                            view.value = 'room';
                        }
                    });
                };

                const joinRoom = () => {
                    if(!joinPwd.value) return showMsg("请输入房间密码！");
                    socket.emit('joinRoom', { roomId: joinPwd.value, password: joinPwd.value }, (res) => {
                         if (res.success) {
                             roomId.value = joinPwd.value;
                             roomInfo.value = res.roomInfo;
                             view.value = 'room';
                         } else {
                             showMsg(res.message);
                         }
                    });
                };

                const selectSeat = (seat) => {
                    if (roomInfo.value.seats[seat] && mySeat.value !== seat) return;
                    socket.emit('selectSeat', { roomId: roomId.value, seat }, (res) => {
                        if (res.success) {
                            mySeat.value = seat;
                        } else {
                            showMsg(res.message);
                        }
                    });
                };

                const ready = () => {
                    if(!mySeat.value) return showMsg('请先选择一个座位！');
                    socket.emit('ready', { roomId: roomId.value });
                };

                const exitGame = () => {
                    if(confirm("确定要退出当前房间吗？")) {
                        window.location.reload();
                    }
                };

                const sortHand = () => {
                    hand.value.sort((a, b) => {
                        const typeA = winds.includes(a) ? 3 : a.includes('索') ? 2 : a.includes('筒') ? 1 : 0;
                        const typeB = winds.includes(b) ? 3 : b.includes('索') ? 2 : b.includes('筒') ? 1 : 0;
                        if(typeA !== typeB) return typeA - typeB;
                        return a.localeCompare(b);
                    });
                };

                const isWind = (tile) => winds.includes(tile);
                
                const getTileClass = (tile) => {
                    if(isWind(tile)) return 'wind';
                    if(tile.includes('万')) return 'wan';
                    if(tile.includes('筒')) return 'tong';
                    if(tile.includes('索')) return 'text-green-600';
                    return '';
                };

                const drawTile = () => {
                    socket.emit('drawTile', { roomId: roomId.value });
                };

                const declareTing = () => {
                    if (hand.value.length < 14) return showMsg("必须摸牌（满14张）后才能报听！");
                    pendingTing.value = true;
                    showMsg("请选择一张风牌打出以完成报听");
                };

                const discardTile = (index) => {
                    if (gameState.value.currentTurn !== mySeat.value) {
                        return showMsg("还没轮到你出牌！");
                    }
                    if (hand.value.length !== 14) {
                        return showMsg("请先摸牌！");
                    }
                    
                    const tile = hand.value[index];
                    
                    if (pendingTing.value && !isWind(tile)) {
                         return showMsg("【规则限制】报听时必须打出风牌！");
                    }

                    socket.emit('discardTile', { 
                        roomId: roomId.value, 
                        index: index,
                        isTingAction: pendingTing.value
                    });
                    
                    pendingTing.value = false;
                };

                return {
                    view, createPwd, joinPwd, roomId, mySeat, roomInfo, gameState,
                    createRoom, joinRoom, selectSeat, ready, exitGame,
                    hand, isTing, pendingTing, msg, waitingMsg,
                    drawTile, declareTing, discardTile, isWind, getTileClass
                };
            }
        }).mount('#app');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1890ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="成分扫描">
    <title>食品安全专家 - 全成分深度扫描</title>
    <!-- Tesseract.js for OCR -->
    <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
    <!-- HTML5-QRCode for Barcode/QR scanning -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="./product_cache.js"></script>
    <style>
        :root { --danger: #ff4d4f; --warning: #faad14; --info: #1890ff; --safe: #52c41a; }
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 15px; line-height: 1.5; color: #333; max-width: 560px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .btn-main { display: block; width: 100%; background: var(--info); color: white; text-align: center; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        .btn-sub { background: #e6f7ff; color: var(--info); border: 1px solid #91d5ff; }
        #status { text-align: center; margin: 10px 0; font-size: 14px; color: #666; min-height: 20px; word-break: break-all; }
        #cacheMeta { text-align: center; font-size: 12px; color: #999; min-height: 18px; margin-bottom: 10px; }
        #actionArea { display: none; }
        .report-section { border-radius: 10px; padding: 15px; margin-top: 15px; display: none; }
        .danger-bg { background: #fff1f0; border-left: 5px solid var(--danger); }
        .warning-bg { background: #fffbe6; border-left: 5px solid var(--warning); }
        .section-title { font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; font-size: 16px; }
        .item-tag { display: inline-block; background: white; padding: 2px 8px; border-radius: 4px; margin: 3px; font-size: 13px; border: 1px solid #ddd; font-weight: 500; }
        .ingredient-card { background: rgba(255,255,255,0.92); border: 1px solid rgba(0,0,0,0.06); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
        .ingredient-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
        .ingredient-name { font-weight: 700; font-size: 14px; color: #222; }
        .ingredient-meta { font-size: 12px; color: #666; }
        .ingredient-desc { font-size: 13px; color: #333; margin-top: 4px; }
        .ingredient-injury { font-size: 13px; color: #b42318; margin-top: 6px; font-weight: 600; }
        .ingredient-advice { font-size: 12px; color: #666; margin-top: 6px; }
        .score-box { display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 2px solid #d6e8ff; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        .score-box.danger { background: #fff1f0; border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,77,79,0.12); }
        .score-box.warning { background: #fffbe6; border-color: var(--warning); }
        .score-box.safe { background: #f6ffed; border-color: var(--safe); }
        .score-num { font-size: 40px; font-weight: 800; color: var(--info); line-height: 1; }
        .score-box.danger .score-num { color: var(--danger); }
        .score-box.warning .score-num { color: #ad6800; }
        .score-box.safe .score-num { color: var(--safe); }
        .score-meta { flex: 1; font-size: 13px; color: #555; }
        .score-level { font-weight: 800; color: #222; margin-bottom: 3px; font-size: 18px; }
        .analysis-source { font-size: 12px; color: #777; margin: -4px 0 10px; }
        .audience-area { border: 1px solid #e7e7e7; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
        .audience-row { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; }
        .audience-row:last-child { border-bottom: 0; }
        .audience-head { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; margin-bottom: 3px; }
        .audience-danger { color: #b42318; }
        .audience-warning { color: #ad6800; }
        .audience-safe { color: #237804; }
        .progress-area { display: none; margin: 8px 0 12px; }
        .progress-track { height: 9px; overflow: hidden; background: #e8e8e8; border-radius: 5px; }
        .progress-bar { width: 0; height: 100%; background: var(--info); transition: width .2s ease; }
        .progress-text { margin-top: 5px; font-size: 12px; text-align: center; color: #666; }
        .advice { font-size: 12px; color: #777; margin-top: 8px; font-style: italic; border-top: 1px dashed #ddd; padding-top: 5px; }
        #reader { width: 100%; display: none; margin-bottom: 10px; border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0">🔬 食品成分全扫描</h2>
    <p style="font-size:12px; color:#777;">依据标准：<a href="https://www.nhc.gov.cn/sps/c100088/202403/bda120e678df4a49a8beb90852559d7c.shtml" target="_blank" rel="noopener">GB 2760-2024</a>；E 编号用于辅助识别</p>
    
    <button class="btn-main" onclick="toggleScanner()">
        🔍 扫描商品条码/二维码
    </button>
    <div id="reader"></div>

    <button class="btn-main btn-sub" onclick="cloudScanPrompt()">
        🏷️ 手动输入条形码
    </button>

    <label class="btn-main btn-sub">
        📷 手动拍配料表
        <input type="file" id="ocrInput" accept="image/*" capture="environment" style="display: none;">
    </label>
    
    <div id="status">准备就绪</div>
    <div id="progressArea" class="progress-area" aria-live="polite">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="progressText" class="progress-text"></div>
    </div>
    <div id="cacheMeta"></div>

    <div id="actionArea">
        <button class="btn-main btn-sub" type="button" onclick="triggerOcrCapture()">
            📷 继续拍配料表写入缓存
        </button>
    </div>
</div>

<div id="reportBox" class="card" style="display:none;">
    <h3 id="reportTitle" style="margin-top:0">检测报告</h3>
    <div id="scoreArea" class="score-box"></div>
    <div id="analysisSource" class="analysis-source"></div>
    <div class="section-title">人群适用提醒</div>
    <div id="audienceArea" class="audience-area"></div>
    
    <div id="dangerArea" class="report-section danger-bg">
        <div class="section-title">🔴 高风险/建议避开</div>
        <div id="dangerList"></div>
        <div class="advice">提示：风险受食品类别、添加量和食用频率影响，不能仅凭名称判断是否超标。</div>
    </div>

    <div id="warningArea" class="report-section warning-bg">
        <div class="section-title">🟡 需注意的添加剂</div>
        <div id="warningList"></div>
        <div class="advice">提示：合法限量使用不等于有害；以下内容用于识别敏感人群和高频摄入风险。</div>
    </div>
    
    <div id="safeArea" class="report-section" style="background: #f6ffed; border-left: 5px solid var(--safe);">
        <div class="section-title">🟢 未检测到敏感成分</div>
        <div class="advice">配料表相对干净，或商品未包含监控词汇。</div>
    </div>
</div>

const LOCAL_CACHE_KEY = "food-scan-cache-v1";
const CLOUD_SOURCE_CONFIG = {
    // GitHub Pages 前端代码会公开，私有 API key 不应写在这里。
    tanshuKey: ""
};
const OCR_LANGUAGE = "chi_sim";
const OCR_MAX_WIDTH = 1600;
const OCR_JPEG_QUALITY = 0.82;
const FETCH_TIMEOUT_MS = 4500;
const BARCODE_FORMATS = window.Html5QrcodeSupportedFormats ? [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39
] : undefined;
const statusTxt = document.getElementById("status");
const cacheMeta = document.getElementById("cacheMeta");
const actionArea = document.getElementById("actionArea");
const reportBox = document.getElementById("reportBox");
const ocrInput = document.getElementById("ocrInput");
const progressArea = document.getElementById("progressArea");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const staticCache = (window.STATIC_PRODUCT_CACHE && window.STATIC_PRODUCT_CACHE.products) || {};

let html5QrCode;
let currentLookupCode = "";
let currentProductName = "";
let currentIngredients = "";
let ocrWorkerPromise = null;
let ocrInProgress = false;

function normalizeBarcode(code) {
    return String(code || "").replace(/\D/g, "");
}

function loadLocalCache() {
    try {
        return JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY) || "{}");
    } catch (err) {
        console.error(err);
        return {};
    }
}

function saveLocalCache(cache) {
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(cache));
}

function getCacheEntry(code) {
    const normalizedCode = normalizeBarcode(code);
    if (!normalizedCode) return null;

    const localCache = loadLocalCache();
    return localCache[normalizedCode] || staticCache[normalizedCode] || null;
}

function upsertLocalCache(code, payload) {
    const normalizedCode = normalizeBarcode(code);
    if (!normalizedCode || !payload.ingredients || payload.ingredients.trim().length < 6) return;

    const localCache = loadLocalCache();
    localCache[normalizedCode] = {
        barcode: normalizedCode,
        productName: payload.productName || `商品 (${normalizedCode})`,
        ingredients: payload.ingredients,
        source: payload.source || "manual",
        updatedAt: new Date().toLocaleString("zh-CN", { hour12: false })
    };
    saveLocalCache(localCache);
    renderCacheMeta(`本地缓存已收录 ${Object.keys(localCache).length} 条，当前商品已写入缓存`);
}

function renderCacheMeta(extraMessage) {
    const localCount = Object.keys(loadLocalCache()).length;
    const staticCount = Object.keys(staticCache).length;
    const summary = `静态库 ${staticCount} 条，本地缓存 ${localCount} 条`;
    cacheMeta.innerText = extraMessage ? `${summary}；${extraMessage}` : summary;
}

function showOcrAction(message) {
    statusTxt.innerText = message;
    actionArea.style.display = "block";
}

function hideOcrAction() {
    actionArea.style.display = "none";
}

function setProgress(percent, message) {
    const value = Math.max(0, Math.min(100, Math.round(percent)));
    progressArea.style.display = "block";
    progressBar.style.width = `${value}%`;
    progressText.innerText = message || `分析中 ${value}%`;
}

function triggerOcrCapture() {
    ocrInput.click();
}

function preparePendingProduct(code, productName) {
    currentLookupCode = normalizeBarcode(code);
    currentProductName = productName || (currentLookupCode ? `商品 (${currentLookupCode})` : "拍照识别报告");
    currentIngredients = "";
}

function consumeCachedEntry(entry, code) {
    currentLookupCode = normalizeBarcode(code);
    currentProductName = entry.productName || `商品 (${currentLookupCode})`;
    currentIngredients = entry.ingredients || "";
    statusTxt.innerText = `✅ 已命中缓存库：${currentProductName}`;
    hideOcrAction();
    runAnalysis(currentIngredients, `${currentProductName}（缓存）`, "本地风险库 + 本地商品缓存");
}

async function fetchJsonWithTimeout(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    } finally {
        clearTimeout(timer);
    }
}

async function queryOpenFoodFactsProduct(code) {
    const data = await fetchJsonWithTimeout(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    data.source = "openfoodfacts-product";
    return data;
}

async function queryOpenFoodFactsSearch(code) {
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(code)}&search_simple=1&action=process&json=1&page_size=5`;
    const data = await fetchJsonWithTimeout(url);
    const products = Array.isArray(data.products) ? data.products : [];

    const matchedProduct = products.find((item) => {
        const productCode = normalizeBarcode(item.code);
        return productCode === normalizeBarcode(code);
    }) || products[0];

    return {
        status: matchedProduct ? 1 : 0,
        product: matchedProduct || null,
        source: "openfoodfacts-search"
    };
}

async function queryTanshuBarcode(code) {
    const key = (CLOUD_SOURCE_CONFIG.tanshuKey || "").trim();
    if (!key) {
        return {
            status: -1,
            product: null,
            message: "missing_key"
        };
    }

    const url = `https://api2.tanshuapi.com/api/barcode/v1/index?key=${encodeURIComponent(key)}&barcode=${encodeURIComponent(code)}`;
    const data = await fetchJsonWithTimeout(url);
    const payload = data.data || {};

    return {
        status: data.code === 1 ? 1 : 0,
        product: data.code === 1 ? {
            code: payload.barcode || code,
            product_name: payload.goods_name || payload.name || `商品 (${code})`,
            product_name_zh: payload.goods_name || payload.name || "",
            ingredients_text: payload.ingredients_text || payload.ingredients || "",
            ingredients_text_zh: payload.ingredients_text_zh || payload.ingredients_zh || "",
            brands: payload.brand || "",
            image_url: payload.image || ""
        } : null,
        message: data.msg || "",
        source: "tanshu"
    };
}

function isScannerSupported() {
    return window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1";
}

function updateOcrProgress(message) {
    if (ocrInProgress) {
        statusTxt.innerText = message;
    }
}

async function getOcrWorker() {
    if (!ocrWorkerPromise) {
        ocrWorkerPromise = (async () => {
            const worker = await Tesseract.createWorker({
                logger: (message) => {
                    if (!ocrInProgress || message.status !== "recognizing text") return;
                    const progress = Math.max(1, Math.round((message.progress || 0) * 100));
                    updateOcrProgress(`🌀 正在识别配料信息... ${progress}%`);
                    setProgress(20 + progress * 0.7, `识别配料表 ${progress}%`);
                }
            });
            await worker.loadLanguage(OCR_LANGUAGE);
            await worker.initialize(OCR_LANGUAGE);
            return worker;
        })().catch((err) => {
            ocrWorkerPromise = null;
            throw err;
        });
    }

    return ocrWorkerPromise;
}

function preloadOcrWorker() {
    getOcrWorker().catch((err) => console.error("OCR worker preload failed:", err));
}

async function loadImageElement(file) {
    const objectUrl = URL.createObjectURL(file);
    try {
        const img = new Image();
        img.decoding = "async";
        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = objectUrl;
        });
        return img;
    } finally {
        URL.revokeObjectURL(objectUrl);
    }
}

async function buildOcrImage(file) {
    const img = await loadImageElement(file);
    const scale = Math.min(1, OCR_MAX_WIDTH / img.width);
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.width * scale));
    canvas.height = Math.max(1, Math.round(img.height * scale));

    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imageData.data;
    for (let i = 0; i < pixels.length; i += 4) {
        const gray = pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114;
        const boosted = gray > 160 ? 255 : gray < 70 ? 0 : gray;
        pixels[i] = boosted;
        pixels[i + 1] = boosted;
        pixels[i + 2] = boosted;
    }
    ctx.putImageData(imageData, 0, 0);

    return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob || file), "image/jpeg", OCR_JPEG_QUALITY);
    });
}

ocrInput.onchange = async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    statusTxt.innerHTML = "🌀 正在优化图片并准备识别...";
    reportBox.style.display = "none";
    ocrInProgress = true;
    setProgress(8, "读取配料表图片");

    try {
        const worker = await getOcrWorker();
        updateOcrProgress("🌀 正在压缩图片...");
        setProgress(15, "优化图片清晰度");
        const optimizedImage = await buildOcrImage(file);
        updateOcrProgress("🌀 正在识别配料信息... 1%");
        const { data: { text } } = await worker.recognize(optimizedImage);
        const finalTitle = currentProductName || "拍照识别报告";
        const cleanText = text.replace(/\s+/g, "");

        if (currentLookupCode && cleanText.length >= 6) {
            currentIngredients = text;
            upsertLocalCache(currentLookupCode, {
                productName: finalTitle,
                ingredients: text,
                source: "ocr"
            });
        }

    hideOcrAction();
    runAnalysis(text, currentLookupCode ? `${finalTitle}（OCR补全）` : finalTitle, "本地风险库 + OCR 配料识别");
    } catch (err) {
        console.error(err);
        statusTxt.innerText = "❌ 识别失败，请确保文字清晰";
    } finally {
        ocrInProgress = false;
        e.target.value = "";
    }
};

function toggleScanner() {
    const readerDiv = document.getElementById("reader");
    if (readerDiv.style.display === "block") {
        stopScanner();
        return;
    }

    if (!isScannerSupported()) {
        showOcrAction("❌ 当前环境不支持摄像头扫码，请通过 GitHub Pages HTTPS 打开，或直接拍配料表");
        return;
    }

    if (!window.Html5Qrcode) {
        showOcrAction("❌ 条码识别组件未加载，请手动输入条码或拍配料表");
        return;
    }

    readerDiv.style.display = "block";
    statusTxt.innerText = "📷 正在启动相机...";
    setProgress(5, "启动相机");
    reportBox.style.display = "none";
    hideOcrAction();

    html5QrCode = new Html5Qrcode("reader");
    const config = {
        fps: 15,
        qrbox: { width: 300, height: 140 },
        rememberLastUsedCamera: true,
        formatsToSupport: BARCODE_FORMATS,
        experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
        }
    };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
        .then(() => {
            statusTxt.innerText = "📷 请将条形码横向对准取景框，保持 10-20 厘米距离";
            setProgress(15, "等待识别条码");
        })
        .catch((err) => {
            showOcrAction("❌ 无法调用摄像头，请手动输入条码，或直接拍配料表分析");
            console.error(err);
        });
}

function stopScanner() {
    if (!html5QrCode) return;

    html5QrCode.stop()
        .then(() => {
            document.getElementById("reader").style.display = "none";
            statusTxt.innerText = "准备就绪";
        })
        .catch((err) => console.error(err));
}

function onScanSuccess(decodedText) {
    stopScanner();
    const code = normalizeBarcode(decodedText);
    statusTxt.innerText = `✅ 扫码成功: ${code}，正在查询...`;
    setProgress(25, "条码识别成功，查询商品");
    lookupProduct(code);
}

function onScanFailure() {
    // 忽略持续扫描中的失败
}

function cloudScanPrompt() {
    const rawCode = prompt("请输入商品 13 位条形码:");
    const code = normalizeBarcode(rawCode);

    if (!code) return;
    lookupProduct(code);
}

function lookupProduct(code) {
    const normalizedCode = normalizeBarcode(code);
    if (!normalizedCode) {
        statusTxt.innerText = "❌ 条形码格式无效，请重新输入";
        return;
    }

    preparePendingProduct(normalizedCode, `商品 (${normalizedCode})`);
    fetchCloudData(normalizedCode);
}

async function fetchCloudData(code) {
    statusTxt.innerText = `🌐 正在查询商品库: ${code}...`;
    reportBox.style.display = "none";
    setProgress(30, "读取本地缓存并联网查询");

    try {
        const cacheEntry = getCacheEntry(code);
        let data = await queryOpenFoodFactsProduct(code);
        setProgress(55, "已完成主商品库查询");

        if (data.status !== 1) {
            statusTxt.innerText = `🌐 主接口未命中，正在补查 Open Food Facts 搜索库: ${code}...`;
            setProgress(65, "主库未命中，正在补查");
            data = await queryOpenFoodFactsSearch(code);
        }

        if (data.status !== 1) {
            statusTxt.innerText = `🌐 Open Food Facts 未命中，正在补查探数商品库: ${code}...`;
            const tanshuData = await queryTanshuBarcode(code);
            if (tanshuData.status !== -1) {
                data = tanshuData;
            }
        }

        if (data.status === 1) {
            const product = data.product || {};
            const ingredients = product.ingredients_text_zh || product.ingredients_text || "";
            const productName = product.product_name_zh || product.product_name || `商品 (${code})`;
            preparePendingProduct(code, productName);

            if (ingredients.trim()) {
                currentIngredients = ingredients;
                upsertLocalCache(code, {
                    productName,
                    ingredients,
                    source: data.source || "cloud"
                });
                hideOcrAction();
                runAnalysis(ingredients, productName, "本地风险库 + Open Food Facts 联网数据");
            } else if (cacheEntry && cacheEntry.ingredients) {
                statusTxt.innerText = `⚠️ 联网已找到“${productName}”，但云端缺配料表，已回退本地缓存`;
                hideOcrAction();
                consumeCachedEntry({
                    ...cacheEntry,
                    productName: cacheEntry.productName || productName
                }, code);
            } else {
                setProgress(100, "联网完成，等待拍摄配料表");
                showOcrAction(getBarcodeFallbackMessage("missing_ingredients", productName));
            }
        } else {
            if (cacheEntry && cacheEntry.ingredients) {
                statusTxt.innerText = "⚠️ 云端未收录该商品，已回退本地缓存";
                hideOcrAction();
                consumeCachedEntry(cacheEntry, code);
            } else {
                preparePendingProduct(code, `商品 (${code})`);
                setProgress(100, "商品库未收录，等待拍摄配料表");
                showOcrAction(getBarcodeFallbackMessage("not_found"));
            }
        }
    } catch (err) {
        console.error(err);
        const cacheEntry = getCacheEntry(code);
        if (cacheEntry && cacheEntry.ingredients) {
            statusTxt.innerText = "⚠️ 联网失败，已回退本地缓存";
            hideOcrAction();
            consumeCachedEntry(cacheEntry, code);
        } else {
            setProgress(100, "联网超时或失败，等待拍摄配料表");
            showOcrAction(getBarcodeFallbackMessage("offline"));
        }
    }
}

function collectIngredientAnalysis(rawText) {
    const cleanText = normalizeIngredientText(rawText);
    const results = { danger: [], warning: [], score: 96 };
    const seen = new Set();
    const seenMatches = [];

    for (let key in MASTER_DB) {
        const group = MASTER_DB[key];
        [...group.keywords].sort((a, b) => getLongestAliasLength(b) - getLongestAliasLength(a)).forEach((word) => {
            if (seen.has(word)) return;
            const matchedAlias = findMatchedAlias(cleanText, word);
            if (matchedAlias) {
                const normalizedMatch = normalizeIngredientText(matchedAlias);
                if (seenMatches.some((hit) => hit.includes(normalizedMatch) || normalizedMatch.includes(hit))) return;
                seen.add(word);
                seenMatches.push(normalizedMatch);
                const detail = getIngredientDetail(word, group, matchedAlias);
                if (group.color === "danger") {
                    results.danger.push(detail);
                } else {
                    results.warning.push(detail);
                }
            }
        });
    }

    results.score = Math.max(20, 96 - results.danger.length * 28 - results.warning.length * 7);
    return results;
}

function getSafetySummary(results) {
    if (results.danger.length > 0 || results.score < 70) {
        return { level: "高风险", tone: "danger", text: "命中高风险或多项需注意成分，建议减少或避开。" };
    }
    if (results.warning.length > 0 || results.score < 90) {
        return { level: "需谨慎", tone: "warning", text: "有添加剂提醒，偶尔食用可以，长期高频不建议。" };
    }
    return { level: "较安全", tone: "safe", text: "本地风险库未发现明显敏感成分，仍需结合总糖、总钠和食用频率。" };
}

function getAudienceAdvice(results) {
    const highRisk = results.danger.length > 0;
    const needsCare = highRisk || results.warning.length > 0;
    return [
        {
            name: "成人",
            level: highRisk ? "建议少吃或避开" : needsCare ? "可偶尔食用" : "一般可食用",
            tone: highRisk ? "danger" : needsCare ? "warning" : "safe",
            harm: highRisk ? "高频摄入可能增加心血管、代谢或胃肠负担。" : "需结合总糖、总钠、过敏史和食用频率判断。"
        },
        {
            name: "孕妇",
            level: highRisk ? "不建议食用" : needsCare ? "建议谨慎" : "一般可食用",
            tone: highRisk ? "danger" : needsCare ? "warning" : "safe",
            harm: "孕期对亚硝酸盐、酒精、过敏原和高加工食品应更谨慎，不能替代医生建议。"
        },
        {
            name: "儿童",
            level: highRisk ? "不建议食用" : needsCare ? "建议少量" : "一般可食用",
            tone: highRisk ? "danger" : needsCare ? "warning" : "safe",
            harm: "儿童处于生长发育期，应减少色素、甜味剂、加工肉和高糖高钠食品的高频摄入。"
        }
    ];
}

function getBarcodeFallbackMessage(reason, productName) {
    if (reason === "missing_ingredients" && productName) {
        return `⚠️ 已找到“${productName}”，但商品库没有配料表，请拍配料表继续分析`;
    }
    if (reason === "offline") {
        return "❌ 联网查询失败，请直接拍配料表继续分析并写入本地缓存";
    }
    return "❓ 商品库暂未收录该条码，请拍配料表继续分析并写入本地缓存";
}

function runAnalysis(rawText, title, source = "本地风险库") {
    const results = collectIngredientAnalysis(rawText);
    const summary = getSafetySummary(results);
    document.getElementById("dangerList").innerHTML = "";
    document.getElementById("warningList").innerHTML = "";

    document.getElementById("reportTitle").innerText = title;
    const scoreArea = document.getElementById("scoreArea");
    scoreArea.className = `score-box ${summary.tone}`;
    scoreArea.innerHTML = `
        <div class="score-num">${results.score}</div>
        <div class="score-meta">
            <div class="score-level">安全系数：${summary.level}</div>
            <div>${summary.text}</div>
        </div>
    `;
    document.getElementById("analysisSource").innerText = `分析来源：${source}`;
    document.getElementById("audienceArea").innerHTML = getAudienceAdvice(results).map((item) => `
        <div class="audience-row">
            <div class="audience-head"><span>${item.name}</span><span class="audience-${item.tone}">${item.level}</span></div>
            <div>${item.harm}</div>
        </div>
    `).join("");
    reportBox.style.display = "block";

    let hasIssues = false;

    if (results.danger.length > 0) {
        document.getElementById("dangerArea").style.display = "block";
        document.getElementById("dangerList").innerHTML = renderIngredientCards(results.danger);
        hasIssues = true;
    } else {
        document.getElementById("dangerArea").style.display = "none";
    }

    if (results.warning.length > 0) {
        document.getElementById("warningArea").style.display = "block";
        document.getElementById("warningList").innerHTML = renderIngredientCards(results.warning);
        hasIssues = true;
    } else {
        document.getElementById("warningArea").style.display = "none";
    }

    if (hasIssues) {
        statusTxt.innerHTML = "✅ 分析完成，请查看下方报告";
        document.getElementById("safeArea").style.display = "none";
    } else {
        statusTxt.innerHTML = "✅ 分析完成，未发现库中定义的敏感成分。";
        document.getElementById("safeArea").style.display = "block";
    }
    setProgress(100, "分析完成");
}

function getLongestAliasLength(word) {
    return Math.max(...(INGREDIENT_ALIASES[word] || [word]).map((alias) => normalizeIngredientText(alias).length));
}

function findMatchedAlias(cleanText, word) {
    const aliases = INGREDIENT_ALIASES[word] || [word];
    for (const alias of [...aliases].sort((a, b) => normalizeIngredientText(b).length - normalizeIngredientText(a).length)) {
        const normalizedAlias = normalizeIngredientText(alias);
        if (normalizedAlias && cleanText.includes(normalizedAlias)) {
            return alias;
        }
    }
    return "";
}

function getIngredientDetail(word, group, matchedAlias) {
    const detail = INGREDIENT_DETAILS[word] || {};
    return {
        word,
        matchedAlias,
        category: group.label,
        hazard: detail.hazard || group.desc,
        injury: detail.injury || getIngredientInjury(group.label),
        advice: detail.advice || "建议结合整体配料表复杂度、食用频率和个人体质综合判断。",
        level: group.label
    };
}

function getIngredientInjury(category) {
    const injuries = {
        "极高风险": "长期或高频摄入可能增加心血管、代谢或相关慢性健康风险。",
        "发色剂": "加工肉高频摄入可能增加亚硝酸盐及其相关反应产物的暴露风险。",
        "防腐剂": "过量摄入或敏感个体可能出现胃肠不适、喘息或过敏样反应。",
        "合成色素": "敏感人群可能出现皮疹、喘息等过敏样反应，儿童应减少高频摄入。",
        "甜味剂/代糖": "过量可能引起腹胀、腹泻或胃肠不适，特殊代谢疾病人群需避开特定成分。",
        "增鲜/增香剂": "高钠、高尿酸或痛风人群可能增加代谢负担。",
        "增稠/乳化剂": "大量或不耐受时可能引起腹胀、腹泻等胃肠不适。",
        "抗氧化剂": "合规用量通常风险较低，长期叠加高摄入可能增加代谢负担。",
        "酸度调节剂": "高频摄入酸性食品可能刺激胃部并增加牙釉质侵蚀风险。",
        "磷酸盐类": "长期高磷摄入可能增加肾脏和骨代谢负担。"
    };
    return injuries[category] || "过量或高频摄入可能带来胃肠不适或额外代谢负担。";
}

function renderIngredientCards(items) {
    return items.map((item) => {
        const hitText = item.matchedAlias && item.matchedAlias !== item.word
            ? `命中写法：${item.matchedAlias}`
            : `命中成分：${item.word}`;
        return `
            <div class="ingredient-card">
                <div class="ingredient-head">
                    <div class="ingredient-name">${item.word}</div>
                    <div class="ingredient-meta">${item.level} · ${hitText}</div>
                </div>
                <div class="ingredient-desc">${item.hazard}</div>
                <div class="ingredient-injury">可能伤害：${item.injury}</div>
                <div class="ingredient-advice">建议：${item.advice}</div>
            </div>
        `;
    }).join("");
}

function normalizeIngredientText(rawText) {
    return String(rawText || "")
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0xFEE0))
        .replace(/\s+/g, "")
        .replace(/（/g, "(")
        .replace(/）/g, ")")
        .replace(/，/g, ",")
        .replace(/；/g, ";")
        .replace(/Ｉ\+Ｇ|I\＋G/gi, "I+G")
        .replace(/苯甲酸纳/g, "苯甲酸钠")
        .replace(/山梨酸甲/g, "山梨酸钾")
        .replace(/糖精纳/g, "糖精钠")
        .replace(/双乙酸纳/g, "双乙酸钠")
        .replace(/亚硝酸纳/g, "亚硝酸钠")
        .replace(/硝酸纳/g, "硝酸钠")
        .toUpperCase();
}

renderCacheMeta();
setTimeout(preloadOcrWorker, 600);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品安全专家 - 全成分深度扫描</title>
    <!-- Tesseract.js for OCR -->
    <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
    <!-- HTML5-QRCode for Barcode/QR scanning -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="./product_cache.js"></script>
    <style>
        :root { --danger: #ff4d4f; --warning: #faad14; --info: #1890ff; --safe: #52c41a; }
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 15px; line-height: 1.5; color: #333; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .btn-main { display: block; width: 100%; background: var(--info); color: white; text-align: center; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        .btn-sub { background: #e6f7ff; color: var(--info); border: 1px solid #91d5ff; }
        #status { text-align: center; margin: 10px 0; font-size: 14px; color: #666; min-height: 20px; word-break: break-all; }
        #cacheMeta { text-align: center; font-size: 12px; color: #999; min-height: 18px; margin-bottom: 10px; }
        #actionArea { display: none; }
        .report-section { border-radius: 10px; padding: 15px; margin-top: 15px; display: none; }
        .danger-bg { background: #fff1f0; border-left: 5px solid var(--danger); }
        .warning-bg { background: #fffbe6; border-left: 5px solid var(--warning); }
        .section-title { font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; font-size: 16px; }
        .item-tag { display: inline-block; background: white; padding: 2px 8px; border-radius: 4px; margin: 3px; font-size: 13px; border: 1px solid #ddd; font-weight: 500; }
        .advice { font-size: 12px; color: #777; margin-top: 8px; font-style: italic; border-top: 1px dashed #ddd; padding-top: 5px; }
        #reader { width: 100%; display: none; margin-bottom: 10px; border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0">🔬 食品成分全扫描</h2>
    <p style="font-size:12px; color:#999;">依据标准：GB 2760-2024 (2025.02 实施版)</p>
    
    <label class="btn-main">
        📷 拍摄配料表图片分析
        <input type="file" id="ocrInput" accept="image/*" capture="environment" style="display: none;">
    </label>
    
    <button class="btn-main btn-sub" onclick="toggleScanner()">
        🔍 扫描商品条码/二维码
    </button>
    <div id="reader"></div>

    <button class="btn-main btn-sub" onclick="cloudScanPrompt()" style="margin-top: 10px;">
        🏷️ 手动输入条形码
    </button>
    
    <div id="status">准备就绪</div>
    <div id="cacheMeta"></div>

    <div id="actionArea">
        <button class="btn-main btn-sub" type="button" onclick="triggerOcrCapture()">
            📷 继续拍配料表写入缓存
        </button>
        <button class="btn-main btn-sub" type="button" onclick="exportLocalCache()">
            💾 导出本地缓存
        </button>
    </div>
</div>

<div id="reportBox" class="card" style="display:none;">
    <h3 id="reportTitle" style="margin-top:0">检测报告</h3>
    
    <div id="dangerArea" class="report-section danger-bg">
        <div class="section-title">🔴 高风险/建议避开</div>
        <div id="dangerList"></div>
        <div class="advice">提示：含致癌、生殖毒性风险或心血管重度负担成分。</div>
    </div>

    <div id="warningArea" class="report-section warning-bg">
        <div class="section-title">🟡 需注意的添加剂</div>
        <div id="warningList"></div>
        <div class="advice">提示：合法但建议限制摄入，对特定人群（如痛风、儿童）有影响。</div>
    </div>
    
    <div id="safeArea" class="report-section" style="background: #f6ffed; border-left: 5px solid var(--safe);">
        <div class="section-title">🟢 未检测到敏感成分</div>
        <div class="advice">配料表相对干净，或商品未包含监控词汇。</div>
    </div>
</div>

<script>
// --- 200+ 词根级权威数据库 (分类逻辑) ---
const MASTER_DB = {
    "high_risk": {
        label: "极高风险",
        color: "danger",
        keywords: [
            "反式脂肪", "代可可脂", "氢化", "植脂末", "亚硝酸", "脱氢乙酸", "二氧化钛", "溴酸钾",
            "特丁基对苯二酚", "TBHQ", "偶氮二甲酰胺", "过氧化苯甲酰", "赤藓红", "苋菜红", "新红"
        ],
        desc: "重点：脱氢乙酸钠于2025年起在糕点面包中禁用。"
    },
    "preservatives": {
        label: "防腐剂",
        color: "warning",
        keywords: [
            "苯甲酸", "山梨酸", "丙酸", "纳他霉素", "二氧化硫", "焦亚硫酸", "低亚硫酸", "亚硫酸",
            "对羟基苯甲酸", "双乙酸钠", "乳酸链球菌素"
        ],
        desc: "长期累积摄入可能加重肝肾负担。"
    },
    "colors": {
        label: "合成色素",
        color: "warning",
        keywords: [
            "柠檬黄", "日落黄", "诱惑红", "亮蓝", "胭脂红", "靛蓝", "姜黄素", "二氧化钛"
        ],
        desc: "可能引起儿童注意力不集中或诱发哮喘。"
    },
    "sweeteners": {
        label: "甜味剂/代糖",
        color: "warning",
        keywords: [
            "阿斯巴甜", "安赛蜜", "三氯蔗糖", "糖精钠", "甜蜜素", "纽甜", "赤藓糖醇", "木糖醇"
        ],
        desc: "阿斯巴甜含苯丙氨酸；过量代糖可能影响肠道菌群。"
    },
    "flavor_enhancers": {
        label: "增鲜/增香剂",
        color: "warning",
        keywords: [
            "谷氨酸", "核苷酸", "I+G", "乙基麦芽酚", "麦芽酚", "食用香精", "酵母抽提物"
        ],
        desc: "核苷酸类(I+G)是痛风患者及高尿酸人群的禁忌。"
    },
    "emulsifiers": {
        label: "增稠/乳化剂",
        color: "warning",
        keywords: [
            "卡拉胶", "羧甲基纤维素", "明胶", "果胶", "黄原胶", "单双甘油脂肪酸酯", "磷脂"
        ],
        desc: "部分研究显示卡拉胶等可能诱发轻微肠道炎症。"
    }
};

const LOCAL_CACHE_KEY = "food-scan-cache-v1";
const CLOUD_SOURCE_CONFIG = {
    // 填入探数平台的商品条码查询 key，例如: "xxxxxxxx"
    tanshuKey: "920cacdc29d30037c7c434d19a82aee2"
};
const statusTxt = document.getElementById("status");
const cacheMeta = document.getElementById("cacheMeta");
const actionArea = document.getElementById("actionArea");
const reportBox = document.getElementById("reportBox");
const ocrInput = document.getElementById("ocrInput");
const staticCache = (window.STATIC_PRODUCT_CACHE && window.STATIC_PRODUCT_CACHE.products) || {};

let html5QrCode;
let currentLookupCode = "";
let currentProductName = "";
let currentIngredients = "";

function normalizeBarcode(code) {
    return String(code || "").replace(/\D/g, "");
}

function loadLocalCache() {
    try {
        return JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY) || "{}");
    } catch (err) {
        console.error(err);
        return {};
    }
}

function saveLocalCache(cache) {
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(cache));
}

function getCacheEntry(code) {
    const normalizedCode = normalizeBarcode(code);
    if (!normalizedCode) return null;

    const localCache = loadLocalCache();
    return localCache[normalizedCode] || staticCache[normalizedCode] || null;
}

function upsertLocalCache(code, payload) {
    const normalizedCode = normalizeBarcode(code);
    if (!normalizedCode || !payload.ingredients || payload.ingredients.trim().length < 6) return;

    const localCache = loadLocalCache();
    localCache[normalizedCode] = {
        barcode: normalizedCode,
        productName: payload.productName || `商品 (${normalizedCode})`,
        ingredients: payload.ingredients,
        source: payload.source || "manual",
        updatedAt: new Date().toLocaleString("zh-CN", { hour12: false })
    };
    saveLocalCache(localCache);
    renderCacheMeta(`本地缓存已收录 ${Object.keys(localCache).length} 条，当前商品已写入缓存`);
}

function renderCacheMeta(extraMessage) {
    const localCount = Object.keys(loadLocalCache()).length;
    const staticCount = Object.keys(staticCache).length;
    const summary = `静态库 ${staticCount} 条，本地缓存 ${localCount} 条`;
    cacheMeta.innerText = extraMessage ? `${summary}；${extraMessage}` : summary;
}

function showOcrAction(message) {
    statusTxt.innerText = message;
    actionArea.style.display = "block";
}

function hideOcrAction() {
    actionArea.style.display = "none";
}

function triggerOcrCapture() {
    ocrInput.click();
}

function exportLocalCache() {
    const localCache = loadLocalCache();
    const blob = new Blob(
        [
            "window.STATIC_PRODUCT_CACHE = ",
            JSON.stringify({ products: localCache }, null, 2),
            ";\n"
        ],
        { type: "application/javascript;charset=utf-8" }
    );
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "product_cache_export.js";
    link.click();
    URL.revokeObjectURL(url);
    renderCacheMeta("本地缓存已导出，可覆盖 product_cache.js 持久保存");
}

function preparePendingProduct(code, productName) {
    currentLookupCode = normalizeBarcode(code);
    currentProductName = productName || (currentLookupCode ? `商品 (${currentLookupCode})` : "拍照识别报告");
    currentIngredients = "";
}

function consumeCachedEntry(entry, code) {
    currentLookupCode = normalizeBarcode(code);
    currentProductName = entry.productName || `商品 (${currentLookupCode})`;
    currentIngredients = entry.ingredients || "";
    statusTxt.innerText = `✅ 已命中缓存库：${currentProductName}`;
    hideOcrAction();
    runAnalysis(currentIngredients, `${currentProductName}（缓存）`);
}

async function queryOpenFoodFactsProduct(code) {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    const data = await res.json();
    data.source = "openfoodfacts-product";
    return data;
}

async function queryOpenFoodFactsSearch(code) {
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(code)}&search_simple=1&action=process&json=1&page_size=5`;
    const res = await fetch(url);
    const data = await res.json();
    const products = Array.isArray(data.products) ? data.products : [];

    const matchedProduct = products.find((item) => {
        const productCode = normalizeBarcode(item.code);
        return productCode === normalizeBarcode(code);
    }) || products[0];

    return {
        status: matchedProduct ? 1 : 0,
        product: matchedProduct || null,
        source: "openfoodfacts-search"
    };
}

async function queryTanshuBarcode(code) {
    const key = (CLOUD_SOURCE_CONFIG.tanshuKey || "").trim();
    if (!key) {
        return {
            status: -1,
            product: null,
            message: "missing_key"
        };
    }

    const url = `https://api2.tanshuapi.com/api/barcode/v1/index?key=${encodeURIComponent(key)}&barcode=${encodeURIComponent(code)}`;
    const res = await fetch(url);
    const data = await res.json();
    const payload = data.data || {};

    return {
        status: data.code === 1 ? 1 : 0,
        product: data.code === 1 ? {
            code: payload.barcode || code,
            product_name: payload.goods_name || payload.name || `商品 (${code})`,
            product_name_zh: payload.goods_name || payload.name || "",
            ingredients_text: payload.ingredients_text || payload.ingredients || "",
            ingredients_text_zh: payload.ingredients_text_zh || payload.ingredients_zh || "",
            brands: payload.brand || "",
            image_url: payload.image || ""
        } : null,
        message: data.msg || "",
        source: "tanshu"
    };
}

ocrInput.onchange = async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    statusTxt.innerHTML = "🌀 正在提取配料表文字...";
    reportBox.style.display = "none";

    try {
        const { data: { text } } = await Tesseract.recognize(file, "chi_sim");
        const finalTitle = currentProductName || "拍照识别报告";
        const cleanText = text.replace(/\s+/g, "");

        if (currentLookupCode && cleanText.length >= 6) {
            currentIngredients = text;
            upsertLocalCache(currentLookupCode, {
                productName: finalTitle,
                ingredients: text,
                source: "ocr"
            });
        }

        hideOcrAction();
        runAnalysis(text, currentLookupCode ? `${finalTitle}（OCR补全）` : finalTitle);
    } catch (err) {
        console.error(err);
        statusTxt.innerText = "❌ 识别失败，请确保文字清晰";
    } finally {
        e.target.value = "";
    }
};

function toggleScanner() {
    const readerDiv = document.getElementById("reader");
    if (readerDiv.style.display === "block") {
        stopScanner();
        return;
    }

    readerDiv.style.display = "block";
    statusTxt.innerText = "📷 正在启动相机...";
    reportBox.style.display = "none";
    hideOcrAction();

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
        .then(() => {
            statusTxt.innerText = "📷 请将条码/二维码放入框内进行扫描";
        })
        .catch((err) => {
            statusTxt.innerText = "❌ 无法调用摄像头，请检查权限或尝试使用 HTTPS。";
            console.error(err);
        });
}

function stopScanner() {
    if (!html5QrCode) return;

    html5QrCode.stop()
        .then(() => {
            document.getElementById("reader").style.display = "none";
            statusTxt.innerText = "准备就绪";
        })
        .catch((err) => console.error(err));
}

function onScanSuccess(decodedText) {
    stopScanner();
    const code = normalizeBarcode(decodedText);
    statusTxt.innerText = `✅ 扫码成功: ${code}，正在查询...`;
    lookupProduct(code);
}

function onScanFailure() {
    // 忽略持续扫描中的失败
}

function cloudScanPrompt() {
    const rawCode = prompt("请输入商品 13 位条形码:");
    const code = normalizeBarcode(rawCode);

    if (!code) return;
    lookupProduct(code);
}

function lookupProduct(code) {
    const normalizedCode = normalizeBarcode(code);
    if (!normalizedCode) {
        statusTxt.innerText = "❌ 条形码格式无效，请重新输入";
        return;
    }

    preparePendingProduct(normalizedCode, `商品 (${normalizedCode})`);
    fetchCloudData(normalizedCode);
}

async function fetchCloudData(code) {
    statusTxt.innerText = `🌐 正在查询商品库: ${code}...`;
    reportBox.style.display = "none";

    try {
        const cacheEntry = getCacheEntry(code);
        let data = await queryOpenFoodFactsProduct(code);

        if (data.status !== 1) {
            statusTxt.innerText = `🌐 主接口未命中，正在补查 Open Food Facts 搜索库: ${code}...`;
            data = await queryOpenFoodFactsSearch(code);
        }

        if (data.status !== 1) {
            statusTxt.innerText = `🌐 Open Food Facts 未命中，正在补查探数商品库: ${code}...`;
            const tanshuData = await queryTanshuBarcode(code);
            if (tanshuData.status !== -1) {
                data = tanshuData;
            }
        }

        if (data.status === 1) {
            const product = data.product || {};
            const ingredients = product.ingredients_text_zh || product.ingredients_text || "";
            const productName = product.product_name_zh || product.product_name || `商品 (${code})`;
            preparePendingProduct(code, productName);

            if (ingredients.trim()) {
                currentIngredients = ingredients;
                upsertLocalCache(code, {
                    productName,
                    ingredients,
                    source: data.source || "cloud"
                });
                hideOcrAction();
                runAnalysis(ingredients, productName);
            } else if (cacheEntry && cacheEntry.ingredients) {
                statusTxt.innerText = `⚠️ 联网已找到“${productName}”，但云端缺配料表，已回退本地缓存`;
                hideOcrAction();
                consumeCachedEntry({
                    ...cacheEntry,
                    productName: cacheEntry.productName || productName
                }, code);
            } else {
                showOcrAction(`⚠️ 已找到“${productName}”，但商品库没有配料表，请拍摄包装背面的配料表`);
            }
        } else {
            if (cacheEntry && cacheEntry.ingredients) {
                statusTxt.innerText = "⚠️ 云端未收录该商品，已回退本地缓存";
                hideOcrAction();
                consumeCachedEntry(cacheEntry, code);
            } else {
                preparePendingProduct(code, `商品 (${code})`);
                showOcrAction("❓ 商品库暂未收录该条码，请拍摄配料表，识别后会自动写入本地缓存");
            }
        }
    } catch (err) {
        console.error(err);
        const cacheEntry = getCacheEntry(code);
        if (cacheEntry && cacheEntry.ingredients) {
            statusTxt.innerText = "⚠️ 联网失败，已回退本地缓存";
            hideOcrAction();
            consumeCachedEntry(cacheEntry, code);
        } else {
            showOcrAction("❌ 网络连接失败，请直接拍摄配料表继续分析并写入本地缓存");
        }
    }
}

function runAnalysis(rawText, title) {
    const cleanText = rawText.replace(/\s+/g, "");
    let results = { danger: [], warning: [] };
    document.getElementById("dangerList").innerHTML = "";
    document.getElementById("warningList").innerHTML = "";

    for (let key in MASTER_DB) {
        const group = MASTER_DB[key];
        group.keywords.forEach((word) => {
            if (cleanText.includes(word)) {
                const tagHtml = `<span class="item-tag">${word}</span>`;
                if (group.color === "danger") {
                    results.danger.push(tagHtml);
                } else {
                    results.warning.push(tagHtml);
                }
            }
        });
    }

    document.getElementById("reportTitle").innerText = title;
    reportBox.style.display = "block";

    let hasIssues = false;

    if (results.danger.length > 0) {
        document.getElementById("dangerArea").style.display = "block";
        document.getElementById("dangerList").innerHTML = [...new Set(results.danger)].join("");
        hasIssues = true;
    } else {
        document.getElementById("dangerArea").style.display = "none";
    }

    if (results.warning.length > 0) {
        document.getElementById("warningArea").style.display = "block";
        document.getElementById("warningList").innerHTML = [...new Set(results.warning)].join("");
        hasIssues = true;
    } else {
        document.getElementById("warningArea").style.display = "none";
    }

    if (hasIssues) {
        statusTxt.innerHTML = "✅ 分析完成，请查看下方报告";
        document.getElementById("safeArea").style.display = "none";
    } else {
        statusTxt.innerHTML = "✅ 分析完成，未发现库中定义的敏感成分。";
        document.getElementById("safeArea").style.display = "block";
    }
}

renderCacheMeta();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢乐挖宝</title>
    <!-- 引入分离出去的样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="settings-btn" onclick="openSettings()" title="设置">⚙️</button>
    
    <!-- 设置弹窗 -->
    <div id="settingsModal" class="settings-modal">
        <div class="settings-content">
            <h3>游戏设置</h3>
            <div class="setting-row">
                <label for="colCount">列数 (横向):</label>
                <input type="number" id="colCount" min="3" max="8" value="5">
            </div>
            <div class="setting-row">
                <label for="rowCount">行数 (纵向):</label>
                <input type="number" id="rowCount" min="3" max="10" value="6">
            </div>
            <div class="settings-actions">
                <button onclick="applySettings()">确认并重开 ✔️</button>
                <button class="btn-cancel" onclick="closeSettings()">取消 ❌</button>
            </div>
        </div>
    </div>

    <!-- 游戏主容器 -->
    <div class="game-container">
        <h1>✨ 欢乐挖宝 ✨</h1>
        <div id="stats">
            <div class="score-box">💰 ¥<span id="score">0.00</span></div>
            <button class="btn-next" onclick="nextRound()">下一局 🔄</button>
        </div>
        <div id="grid"></div>
        <div id="message">点击土块开始挖宝！(剩余土块≤20%自动进入下一局)</div>
    </div>

    <!-- 底部装饰容器 -->
    <div class="footer-decoration">
        <div class="grass-bg"></div>
        <!-- 装饰小动物，可以用emoji或者图片 -->
        <div class="animal bunny">🐰</div>
        <div class="animal fox">🦊</div>
        <div class="animal bear">🐻</div>
        <div class="slide">🎢</div>
        <div class="flower">🌸</div>
        <div class="flower f2">🌼</div>
        <div class="butterfly">🦋</div>
    </div>

    <!-- 引入分离出去的JavaScript逻辑 -->
    <script src="game.js"></script>
</body>
</html>
